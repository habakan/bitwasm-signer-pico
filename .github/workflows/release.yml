name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive }
      - uses: astral-sh/setup-uv@v10.2.0
        with: { enable-cache: false }
      - name: Dependencies (pinned by commit, the RISC-V toolchain by hash)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build
          make deps
          make check-deps
          ./tools/build/toolchain.sh
      - name: The parser the firmware embeds is the one jitsu-in released
        run: make check-repro

      # Both builds start from an empty build/rp2350, so the CMake cache cannot carry TESTNET across
      - name: Firmware (mainnet and signet)
        run: |
          mkdir -p dist
          make build/rp2350/app.elf
          cp build/rp2350/app.uf2 dist/jitsu-in-pico.uf2
          rm -rf build/rp2350
          make build/rp2350/app.elf TESTNET=1
          cp build/rp2350/app.uf2 dist/jitsu-in-pico-signet.uf2
          cp build/parser.wasm dist/
          cd dist && sha256sum jitsu-in-pico.uf2 jitsu-in-pico-signet.uf2 parser.wasm > SHA256SUMS && cat SHA256SUMS

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/jitsu-in-pico.uf2
            dist/jitsu-in-pico-signet.uf2

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "**Not reviewed by a third party. Do not put real funds through it.**"
            echo
            echo "- \`jitsu-in-pico.uf2\`: mainnet"
            echo "- \`jitsu-in-pico-signet.uf2\`: signet (\`TESTNET=1\`)"
            echo
            echo "Hold BOOTSEL while connecting the Pico 2 over USB, then copy a UF2 onto the drive."
            echo "Neither build can select the test seed (\`TEST_SEED=0\`)."
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo
            echo "\`parser.wasm\` is the module the firmware embeds, the same bytes as the jitsu-in release it is pinned to."
            echo "Reproduce the UF2s: check out this tag, \`make deps\`, then build as above."
            echo "The same bytes come out on macOS arm64 and Linux x86_64."
            echo
            echo "Provenance: \`gh attestation verify jitsu-in-pico.uf2 --repo $REPO\`"
            echo
            echo "A detached PGP signature over SHA256SUMS is attached when the maintainer signs the release."
          } > notes.md
          gh release create "$TAG" dist/jitsu-in-pico.uf2 dist/jitsu-in-pico-signet.uf2 dist/parser.wasm dist/SHA256SUMS \
            --repo "$REPO" --title "$TAG" --notes-file notes.md
